name: Closed Sentry Full-Feed Canary

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact independently reviewed canary-branch head
        type: string
        required: true
      expected_manifest:
        description: Exact independently reviewed canary manifest SHA256
        type: string
        required: true
      initialize_ledger:
        description: Separately approved one-time ledger initialization, without inference
        type: boolean
        default: false
        required: false

# One-day exact-manifest authority only; no ordinary or recurring activation.
# This registered path is reused ONLY on the reviewed canary branch, never main.
permissions:
  contents: write # Admission CAS and separately approved report-only push.

concurrency:
  group: sentryinsight-report-generation
  cancel-in-progress: false

jobs:
  initialize_ledger:
    if: >-
      inputs.initialize_ledger &&
      github.repository == 'ricomanifesto/SentryInsight' &&
      github.actor == 'ricomanifesto' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/canary/sentry-full-feed-20261105' &&
      github.run_attempt == 1 && github.sha == inputs.expected_commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout the exact reviewed initializer source
        if: runner.debug != '1'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Fix the Git destination without copying a credential
        if: runner.debug != '1'
        run: git remote set-url origin https://github.com/ricomanifesto/SentryInsight.git
      - name: Set up the existing publication Node toolchain
        if: runner.debug != '1'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Initialize only the separately approved fixed public ledger
        if: runner.debug != '1'
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_MANIFEST: ${{ inputs.expected_manifest }}
        run: |
          node scripts/bootstrap_canary_ledger.cjs \
            --expected-commit "$EXPECTED_COMMIT" --expected-manifest "$EXPECTED_MANIFEST" \
            --initialize-public-ledger
  canary:
    if: >-
      !inputs.initialize_ledger &&
      github.repository == 'ricomanifesto/SentryInsight' &&
      github.actor == 'ricomanifesto' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/canary/sentry-full-feed-20261105' &&
      github.run_attempt == 1 && github.sha == inputs.expected_commit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OTEL_SDK_DISABLED: 'true'
      LOGFIRE_SEND_TO_LOGFIRE: 'false'
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
    steps:
      - name: Checkout the exact reviewed temporary source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # Ephemeral job Git authority is needed by the existing persistent CAS.
          # Checkout removes its credential at job end; no new credential is made.
          persist-credentials: true
      - name: Fix the Git destination without copying a credential
        run: git remote set-url origin https://github.com/ricomanifesto/SentryInsight.git
      - name: Set up the existing publication Node toolchain without inference credentials
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Set up pinned dependencies without inference credentials
        uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          version: '0.12.0'
          python-version: '3.11'
          enable-cache: false
      - name: Install frozen dependencies without inference credentials
        run: uv sync --group dev --frozen
      - name: Prepare only fixed public source and verified tokenizer
        env:
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/sentry-canary-tokenizer
        run: |
          .venv/bin/python -I -B - <<'PY'
          import asyncio
          import os
          from pathlib import Path
          import sys
          import httpx
          import tiktoken
          sys.path.insert(0, str(Path.cwd()))
          from scripts.prepare_full_feed_canary import FEED_URL, verify_feed
          from scripts.execute_full_feed_canary import bounded_get
          async def main():
              async with httpx.AsyncClient(trust_env=False, follow_redirects=False, timeout=15) as client:
                  raw = await bounded_get(client, FEED_URL)
              verify_feed(raw)
              Path(os.environ['RUNNER_TEMP'], 'sentry-canary-feed.xml').write_bytes(raw)
          asyncio.run(main())
          tiktoken.get_encoding('cl100k_base')
          PY
      - name: Calibrate the actual host with the closed offline fixture
        env:
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/sentry-canary-tokenizer
        run: |
          .venv/bin/python -I -B scripts/rehearse_full_feed_canary.py --offline-only \
            --feed-file "$RUNNER_TEMP/sentry-canary-feed.xml"
      - name: Preflight the closed authority before secret injection
        id: gate
        if: runner.debug != '1'
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_MANIFEST: ${{ inputs.expected_manifest }}
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/sentry-canary-tokenizer
        run: |
          .venv/bin/python -I -B scripts/execute_full_feed_canary.py --preflight-only \
            --feed-file "$RUNNER_TEMP/sentry-canary-feed.xml" \
            --expected-commit "$EXPECTED_COMMIT" --expected-manifest "$EXPECTED_MANIFEST" \
            --receipt "$RUNNER_TEMP/sentry-canary-metadata.json"
      - name: Consume the single approved canary allocation
        id: trial
        if: steps.gate.outputs.ready == 'true' && runner.debug != '1'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_MANIFEST: ${{ inputs.expected_manifest }}
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/sentry-canary-tokenizer
        run: |
          .venv/bin/python -I -B scripts/execute_full_feed_canary.py --execute-approved-canary \
            --feed-file "$RUNNER_TEMP/sentry-canary-feed.xml" \
            --expected-commit "$EXPECTED_COMMIT" --expected-manifest "$EXPECTED_MANIFEST" \
            --receipt "$RUNNER_TEMP/sentry-canary-metadata.json"
      - name: Retain only allowlisted operational metadata for seven days
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sentry-full-feed-canary-${{ github.run_id }}
          path: ${{ runner.temp }}/sentry-canary-metadata.json
          retention-days: 7
          if-no-files-found: warn
