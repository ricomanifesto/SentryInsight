name: Verify Fictional GRC Workflow Nonpublishing

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: 'Exact reviewed executor commit for one separately approved two-stage trial'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: grc-fictional-workflow-trial-20261104
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository == 'ricomanifesto/SentryInsight' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/test/selected-model-fixtures-20261104' &&
      github.run_attempt == 1 && github.sha == inputs.expected_commit &&
      github.actor == 'ricomanifesto' && github.triggering_actor == 'ricomanifesto'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OTEL_SDK_DISABLED: 'true'
      LOGFIRE_SEND_TO_LOGFIRE: 'false'
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
    steps:
      - name: Checkout the reviewed executor without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: executor
          persist-credentials: false

      - name: Checkout the proposed GRC analysis candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ricomanifesto/GRCInsight
          ref: 9b79f50986b60aa12bccbbf91de0c910a5c482ad
          path: sources/grc
          persist-credentials: false

      - name: Set up pinned uv without shared caches
        uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          version: '0.12.0'
          python-version: '3.11.11'
          enable-cache: false

      - name: Install frozen GRC dependencies without inference credentials
        run: uv sync --project sources/grc/agent --group dev --frozen

      - name: Prepare private metadata directory
        run: |
          sources/grc/agent/.venv/bin/python -I -B - <<'PY'
          import os
          from pathlib import Path
          os.umask(0o077)
          (Path(os.environ['RUNNER_TEMP']) / 'grc-full-trial').mkdir(mode=0o700)
          PY

      - name: Reproduce the complete fictional workflow without provider access
        run: |
          sources/grc/agent/.venv/bin/python -I -B - <<'PY'
          import sys
          sys.path.insert(0, 'executor')
          from scripts.verify_grc_workflow_once import calibrate_ci
          calibrate_ci()
          PY

      - name: Send only the two fixed-scope GRC stages and replay privately
        id: trial
        if: runner.debug != '1'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          sources/grc/agent/.venv/bin/python -I -B executor/scripts/verify_grc_workflow_once.py \
            --expected-commit "$EXPECTED_COMMIT"

      - name: Retain only sanitized metadata for seven days
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: grc-full-trial-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/grc-full-trial/calibration.json
            ${{ runner.temp }}/grc-full-trial/claim.json
            ${{ runner.temp }}/grc-full-trial/trial.json
          retention-days: 7
          if-no-files-found: warn
