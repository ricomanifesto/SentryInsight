name: Verify Vertex Argon Without Publication

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: 'Exact reviewed test executor commit approved for this single trial'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: selected-model-fictional-trial-20261104
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository == 'ricomanifesto/SentryInsight' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/test/selected-model-fixtures-20261104' &&
      github.run_attempt == 1 && github.sha == inputs.expected_commit &&
      github.actor == 'ricomanifesto' && github.triggering_actor == 'ricomanifesto'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OTEL_SDK_DISABLED: 'true'
      LOGFIRE_SEND_TO_LOGFIRE: 'false'
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
    steps:
      - name: Checkout the reviewed executor without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: executor
          persist-credentials: false

      - name: Checkout the exact accepted Sentry source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 4833a2907cff7690a333d9c80825c8339a270e2d
          path: sources/sentry
          persist-credentials: false

      - name: Checkout the exact accepted GRC source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ricomanifesto/GRCInsight
          ref: 800d2f572dc1b4d2a26f4c74fe9b08f33e455c6a
          path: sources/grc
          persist-credentials: false

      - name: Set up pinned uv without shared caches
        uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          version: '0.12.0'
          python-version: '3.11.11'
          enable-cache: false

      - name: Install each source's frozen dependencies without inference credentials
        run: |
          uv sync --project sources/sentry --group dev --frozen
          uv sync --project sources/grc/agent --group dev --frozen

      - name: Prepare private scratch and hash-verified public tokenizer
        run: |
          sources/sentry/.venv/bin/python -B - <<'PY'
          import os
          from pathlib import Path
          os.umask(0o077)
          root = Path(os.environ['RUNNER_TEMP'])
          (root / 'selected-model-trial').mkdir(mode=0o700)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'TIKTOKEN_CACHE_DIR={root / "selected-model-tokenizer"}\n')
          PY
          TIKTOKEN_CACHE_DIR="$RUNNER_TEMP/selected-model-tokenizer" sources/sentry/.venv/bin/python -B - <<'PY'
          import sys
          sys.path.insert(0, 'sources/sentry')
          import tiktoken
          from scripts.verify_nemotron_once import require_tokenizer_cache
          tiktoken.get_encoding('cl100k_base')
          require_tokenizer_cache()
          PY

      - name: Reproduce the exact fictional Vertex Argon request without provider access
        run: |
          sources/sentry/.venv/bin/python -B - <<'PYTHON'
          import sys
          sys.path.insert(0, 'executor')
          from scripts.continue_vertex_trial_once import calibrate_ci
          calibrate_ci()
          PYTHON

      - name: Send only the Vertex Argon request once and replay locally
        id: trial
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          sources/sentry/.venv/bin/python -B executor/scripts/continue_vertex_trial_once.py \
            --expected-commit "$EXPECTED_COMMIT"

      - name: Retain only sanitized metadata for seven days
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: selected-model-trial-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/selected-model-trial/calibration.json
            ${{ runner.temp }}/selected-model-trial/claim.json
            ${{ runner.temp }}/selected-model-trial/trial.json
          retention-days: 7
          if-no-files-found: warn
