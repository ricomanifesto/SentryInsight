name: Validate

# Synthetic-only checks on pull requests and main pushes. Nothing here
# validates or renders a committed report, packages a release, takes a
# screenshot or uploads an artifact, and nothing chains from this workflow:
# promotion is the separate, manual, exact-head approved Publish Production
# and Deploy GitHub Pages dispatch.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      # Live report paths and real facts are never on disk here: the current
      # report and pages, dated archives, correction exchanges and the
      # owner-reviewed fact manifest and surface approval.
      - name: Checkout code without live report paths or real facts
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/index.md
            !/index.html
            !/current-findings.json
            !/sitemap.xml
            !/.sentryinsight-articles-fingerprint
            !/reports/
            !/corrections/
            !/config/paid-readiness-facts.json
            !/config/paid-readiness-surface.json

      - name: Prove live report paths and real facts are absent
        run: |
          git rev-parse --verify HEAD
          git status --porcelain
          for held in index.md index.html current-findings.json sitemap.xml \
              .sentryinsight-articles-fingerprint reports corrections \
              config/paid-readiness-facts.json config/paid-readiness-surface.json; do
            if [ -e "$held" ] || [ -L "$held" ]; then
              echo "Synthetic validation refuses: $held is on disk" >&2
              exit 1
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Verify Python HTTPS runtime
        run: python3 scripts/verify_python_https.py

      - name: Fetch canonical reporting identity verifier
        run: |
          python3 contracts/reporting-identity-verifier-v1.py fetch \
            --artifact verifier \
            --canonical-output "$RUNNER_TEMP/reporting-identity-verifier-v1.py"

      - name: Check reporting identity verifier drift
        run: |
          python3 contracts/reporting-identity-verifier-v1.py compare \
            --artifact verifier \
            --local-artifact contracts/reporting-identity-verifier-v1.py \
            --canonical-artifact "$RUNNER_TEMP/reporting-identity-verifier-v1.py"

      - name: Fetch canonical reporting identity contract
        run: |
          python3 contracts/reporting-identity-verifier-v1.py fetch \
            --artifact contract \
            --canonical-output "$RUNNER_TEMP/reporting-identity-v1.json"

      - name: Check reporting identity contract drift
        run: |
          python3 contracts/reporting-identity-verifier-v1.py compare \
            --artifact contract \
            --local-artifact contracts/reporting-identity-v1.json \
            --canonical-artifact "$RUNNER_TEMP/reporting-identity-v1.json"

      - name: Set up uv
        uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Run synthetic validation
        run: bash scripts/validate_synthetic.sh
