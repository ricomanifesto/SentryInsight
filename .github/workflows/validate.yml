name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      # Matches the locked Playwright package; browsers and OS libraries are baked in.
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    defaults:
      run:
        shell: bash
    # Checkout's temporary HOME does not carry its Git trust into later steps.
    # Trust only this job's checkout, including Git subprocesses in evaluations.
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Verify checkout Git access
        run: |
          git rev-parse --verify HEAD
          git status --porcelain

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Fetch canonical reporting identity verifier
        run: |
          python3 contracts/reporting-identity-verifier-v1.py fetch \
            --artifact verifier \
            --canonical-output "$RUNNER_TEMP/reporting-identity-verifier-v1.py"

      - name: Check reporting identity verifier drift
        run: |
          python3 contracts/reporting-identity-verifier-v1.py compare \
            --artifact verifier \
            --local-artifact contracts/reporting-identity-verifier-v1.py \
            --canonical-artifact "$RUNNER_TEMP/reporting-identity-verifier-v1.py"

      - name: Fetch canonical reporting identity contract
        run: |
          python3 contracts/reporting-identity-verifier-v1.py fetch \
            --artifact contract \
            --canonical-output "$RUNNER_TEMP/reporting-identity-v1.json"

      - name: Check reporting identity contract drift
        run: |
          python3 contracts/reporting-identity-verifier-v1.py compare \
            --artifact contract \
            --local-artifact contracts/reporting-identity-v1.json \
            --canonical-artifact "$RUNNER_TEMP/reporting-identity-v1.json"

      - name: Set up uv
        uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install browser test runtime
        run: |
          npm ci
          # Fail before validation if the bundled browser or its libraries are unusable.
          node -e 'require("@playwright/test").chromium.launch().then(browser => browser.close()).catch(error => { console.error(error); process.exit(1); })'

      - name: Run validation
        run: bash scripts/local_validation.sh

      - name: Upload rendered report evidence
        id: report-evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: report-screenshots-${{ github.run_id }}
          path: test-results/screenshots
          if-no-files-found: error

      - name: Add rendered report review summary
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.report-evidence.outputs.artifact-url }}
        run: |
          {
            echo "## Rendered report review"
            echo
            echo "[Open the desktop, tablet, and phone screenshots](${ARTIFACT_URL})"
            echo
            echo "Review the dark logo, report date and counts, finding badges, desktop TOC, and mobile map."
          } >> "$GITHUB_STEP_SUMMARY"
