name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install browser test runtime
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run validation
        run: bash scripts/local_validation.sh

      - name: Upload rendered report evidence
        id: report-evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-screenshots-${{ github.run_id }}
          path: test-results/screenshots
          if-no-files-found: error

      - name: Add rendered report review summary
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.report-evidence.outputs.artifact-url }}
        run: |
          {
            echo "## Rendered report review"
            echo
            echo "[Open the desktop, tablet, and phone screenshots](${ARTIFACT_URL})"
            echo
            echo "Review the dark logo, report date and counts, finding badges, desktop TOC, and mobile map."
          } >> "$GITHUB_STEP_SUMMARY"
