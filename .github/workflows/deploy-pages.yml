name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: ["Validate"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Optional exact commit for this manual deployment
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  deploy:
    # This retired workflow remains disabled. If restored, only trusted main
    # source may execute in the job with Pages and OIDC permissions.
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       (inputs.expected_commit == '' || inputs.expected_commit == github.sha)) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      contents: read
      pages: write
      id-token: write
    # Rejected events never enter or cancel the trusted deployment queue.
    concurrency:
      group: sentryinsight-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0

      - name: Install locked dependencies
        run: uv sync --group dev --frozen

      # The substantive report gate applies to manual deployments too; a
      # failure stops before upload, so the deployed mirror stays as it was.
      - name: Validate report content
        run: uv run python scripts/validate_report.py index.md

      - name: Build public artifact
        run: uv run python scripts/package_pages.py --output _site

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
