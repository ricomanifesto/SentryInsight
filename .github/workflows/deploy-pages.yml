name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: ["Validate"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Optional exact commit for this manual deployment
        required: false
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sentryinsight-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       (inputs.expected_commit == '' || inputs.expected_commit == github.sha)) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install locked dependencies
        run: uv sync --group dev --frozen

      # The substantive report gate applies to manual deployments too; a
      # failure stops before upload, so the deployed mirror stays as it was.
      - name: Validate report content
        run: uv run python scripts/validate_report.py index.md

      - name: Build public artifact
        run: uv run python scripts/package_pages.py --output _site

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5

      # Records the completed deployment in the report history store, which
      # attaches it to the projected run of this commit. It runs only after a
      # successful deployment, a failure only annotates the run, and it is
      # skipped until the store is configured.
      - name: Record deployment in report history
        if: success() && vars.CONTROL_PLANE_URL != ''
        env:
          CONTROL_PLANE_URL: ${{ vars.CONTROL_PLANE_URL }}
          CONTROL_PLANE_TOKEN: ${{ secrets.CONTROL_PLANE_PROJECT_TOKEN }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          .venv/bin/python -B -m src.control_plane.projection observe --source-commit "$SOURCE_SHA" --target github-pages \
            || echo "::warning::Deployment was not recorded in report history"
