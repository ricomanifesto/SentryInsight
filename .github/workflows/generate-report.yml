name: Generate Exploitation Report

on:
  # Run when triggered by SentryDigest repository
  repository_dispatch:
    types: [sentrydigest-updated]
  
  # Schedule backup run (in case webhook fails). The workflow now fingerprints
  # the source article set and skips report generation when nothing
  # changed, so this only needs to catch a fully missed webhook, not run often.
  schedule:
    - cron: '30 6 * * *'  # Run once daily at 06:30 UTC
  
  # Allow manual triggering
  workflow_dispatch:
    inputs:
      readmit:
        description: 'Re-admit after an uncertain earlier generation (true/false)'
        required: false
        default: 'false'

concurrency:
  group: sentryinsight-report-generation
  cancel-in-progress: false

jobs:
  generate-report:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT_GITHUB }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Fetch canonical reporting identity verifier
        run: |
          python3 contracts/reporting-identity-verifier-v1.py fetch \
            --artifact verifier \
            --canonical-output "$RUNNER_TEMP/reporting-identity-verifier-v1.py"

      - name: Check reporting identity verifier drift
        run: |
          python3 contracts/reporting-identity-verifier-v1.py compare \
            --artifact verifier \
            --local-artifact contracts/reporting-identity-verifier-v1.py \
            --canonical-artifact "$RUNNER_TEMP/reporting-identity-verifier-v1.py"

      - name: Fetch canonical reporting identity contract
        run: |
          python3 contracts/reporting-identity-verifier-v1.py fetch \
            --artifact contract \
            --canonical-output "$RUNNER_TEMP/reporting-identity-v1.json"

      - name: Check reporting identity contract drift
        run: |
          python3 contracts/reporting-identity-verifier-v1.py compare \
            --artifact contract \
            --local-artifact contracts/reporting-identity-v1.json \
            --canonical-artifact "$RUNNER_TEMP/reporting-identity-v1.json"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install browser test runtime
        run: |
          npm ci
          npx playwright install --with-deps chromium
      
      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Run local validation
        run: bash scripts/local_validation.sh
      
      # Admission before any model call: SentryDigest release events are bound
      # to the release's commit-addressed feed snapshot; duplicate, stale and
      # unbindable events stop here; an earlier generation whose outcome is
      # unknown must be recovered or explicitly re-admitted first.
      - name: Admit generation
        id: admission
        env:
          READMIT: ${{ github.event.inputs.readmit || 'false' }}
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          node publication/cli.js admit --event-name "$GITHUB_EVENT_NAME" --event-path "$GITHUB_EVENT_PATH" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --readmit "$READMIT"

      - name: Bind generator input to the admitted feed snapshot
        if: steps.admission.outputs.decision == 'admitted' && steps.admission.outputs.feed_url != ''
        env:
          FEED_URL: ${{ steps.admission.outputs.feed_url }}
        run: |
          node -e "const fs = require('fs'); const p = 'config/config.json'; const c = JSON.parse(fs.readFileSync(p, 'utf8')); c.feed_url = process.env.FEED_URL; fs.writeFileSync(p, JSON.stringify(c, null, 4) + '\n');"

      - name: Record generation start
        id: invoked
        if: steps.admission.outputs.decision == 'admitted'
        env:
          ADMISSION_KEY: ${{ steps.admission.outputs.admission_key }}
        run: node publication/cli.js invoked --key "$ADMISSION_KEY" --run-id "$GITHUB_RUN_ID"

      - name: Generate exploitation report
        id: generate
        if: steps.admission.outputs.decision == 'admitted'
        run: uv run python main.py
        env:
          # Report generation calls OpenRouter directly (free model default);
          # no local OpenCode gateway is needed in CI.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SENTRYINSIGHT_MODEL: ${{ vars.SENTRYINSIGHT_MODEL || 'openrouter/nvidia/nemotron-3-ultra-550b-a55b:free' }}
          # Pass VT Intelligence API key under multiple common env names
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          VT_INTELLIGENCE_API_KEY: ${{ secrets.VT_INTELLIGENCE_API_KEY }}
          GOOGLE_TI_API_KEY: ${{ secrets.GOOGLE_TI_API_KEY }}
          # Optional tracing, scoped to this step so test runs never export.
          # Without the secret, nothing is sent.
          LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
          LOGFIRE_ENVIRONMENT: github-actions
          LOGFIRE_SERVICE_VERSION: ${{ github.sha }}
      
      - name: Restore generator configuration
        if: always() && steps.admission.outputs.feed_url != ''
        run: git checkout -- config/config.json

      - name: Validate report content before publishing
        if: steps.admission.outputs.decision == 'admitted'
        run: |
          uv run python scripts/validate_report.py index.md
          uv run python scripts/build_site.py --check
          npm run test:browser

      - name: Upload rendered report evidence
        id: generated-report-evidence
        if: always() && steps.admission.outputs.decision == 'admitted'
        uses: actions/upload-artifact@v4
        with:
          name: generated-report-screenshots-${{ github.run_id }}
          path: test-results/screenshots
          if-no-files-found: error

      - name: Add rendered report review summary
        if: always() && steps.admission.outputs.decision == 'admitted'
        env:
          ARTIFACT_URL: ${{ steps.generated-report-evidence.outputs.artifact-url }}
        run: |
          {
            echo "## Rendered report review"
            echo
            echo "[Open the generated desktop, tablet, and phone screenshots](${ARTIFACT_URL})"
            echo
            echo "Review the dark logo, report date and counts, finding badges, desktop TOC, and mobile map before using the report."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push updated report
        id: publish
        if: github.ref == 'refs/heads/main' && steps.admission.outputs.decision == 'admitted'
        env:
          ADMISSION_KEY: ${{ steps.admission.outputs.admission_key }}
          ADMISSION_FEED: ${{ steps.admission.outputs.feed_url }}
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          # Force add the canonical report and generated site files
          git add -f index.md index.html current-findings.json sitemap.xml || true
          git add -f reports/ || true
          git add -f assets/site.css assets/report.js assets/vendor/ || true
          git add -f .sentryinsight-articles-fingerprint || true
          if git diff --cached --quiet; then
            echo "No report changes to commit"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The trailers let a later run recover this exact admission.
          printf 'Update exploitation report [automated]\n\nAdmission-Key: %s\nAdmission-Feed: %s\n' "$ADMISSION_KEY" "${ADMISSION_FEED:-none}" > "$RUNNER_TEMP/report-commit-message.txt"
          git commit -F "$RUNNER_TEMP/report-commit-message.txt"
          git pull --rebase origin main
          git push https://${{ secrets.PAT_GITHUB }}@github.com/${{ github.repository }}.git HEAD:main
          echo "published=true" >> "$GITHUB_OUTPUT"

      # The outcome is recorded whenever generation started and the run is
      # still able to report it. A cancelled or failed generation may leave
      # paid work outstanding, so admission keeps it uncertain until a report
      # is recovered or an operator readmits; a runner lost mid-generation
      # likewise leaves the admission uncertain.
      - name: Record generation outcome
        if: always() && steps.invoked.outcome == 'success'
        env:
          ADMISSION_KEY: ${{ steps.admission.outputs.admission_key }}
          BINDING: ${{ steps.admission.outputs.binding }}
          GENERATE: ${{ steps.generate.outcome }}
          PUBLISHED: ${{ steps.publish.outputs.published }}
        run: |
          if [ "$GENERATE" = "cancelled" ]; then OUTCOME=cancelled
          elif [ "$GENERATE" != "success" ]; then OUTCOME=failed
          elif [ "$PUBLISHED" = "true" ]; then OUTCOME=published
          elif [ "$PUBLISHED" = "false" ]; then OUTCOME=unchanged
          else OUTCOME=not-published
          fi
          node publication/cli.js complete --key "$ADMISSION_KEY" --run-id "$GITHUB_RUN_ID" --outcome "$OUTCOME" --binding "$BINDING"

  # A pushed report is published after Validate succeeds for it. Otherwise
  # the single publisher resumes the current release (state record, proof),
  # so an interrupted publication recovers without promoting new source.
  resume-publication:
    needs: generate-report
    if: always() && needs.generate-report.outputs.published != 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/publish-production.yml
    with:
      invocation: resume
