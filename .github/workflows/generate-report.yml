name: Generate Exploitation Report

# Manual paid readiness only. Publication is the separate, approved defensive
# promotion (publication/DEFENSIVE_PUBLICATION.md): no SentryDigest dispatch,
# schedule, legacy generation or resume reaches it, and nothing here is
# packaged or published.
on:
  workflow_dispatch:
    inputs:
      readmit:
        description: 'Must stay false: paid readiness never readmits'
        required: false
        default: 'false'
      paid_verification:
        description: 'Run only the pinned one-send Kimi readiness route (maximum $2.42, no triage, no retry, no publication)'
        type: boolean
        required: false
        default: false
      billing_evidence:
        description: 'Bounded billing attestation JSON for the readiness route; no credentials or raw account data'
        type: string
        required: false
        default: ''
      expected_head:
        description: 'Paid only: the exact 40-hex main commit this run must execute'
        type: string
        required: false
        default: ''
      fact_manifest_sha256:
        description: 'Paid only: SHA-256 of the reviewed fact manifest committed at that head'
        type: string
        required: false
        default: ''
      surface_approval_sha256:
        description: 'Paid only: SHA-256 of the committed legacy surface approval (empty when none exists)'
        type: string
        required: false
        default: ''

concurrency:
  group: sentryinsight-report-generation
  cancel-in-progress: false

jobs:
  # The hosted legacy generator is held: no legacy checkout, model run,
  # artifact or screenshot upload, report commit or push runs here. main.py
  # and scripts/local_validation.sh stay as offline/local helpers. The only
  # job is the paid readiness route below, reached solely by paid_verification.

  # The manual paid option: one pinned send under the readiness profile.
  # First manual main attempt at the exact dispatched head, readmit=false,
  # the committed fact manifest and surface approval pinned by digest, and
  # only the existing checkout token and OpenRouter key. A rendered pair is
  # retained for owner review only; nothing is committed, pushed, resumed,
  # recorded in history or published. Any failure is final: the admission
  # stays unresolved and its whole reservation remains held.
  paid-readiness:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.paid_verification == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Refuse anything but the first manual main attempt at the exact head
        env:
          EXPECTED_HEAD: ${{ github.event.inputs.expected_head }}
          READMIT: ${{ github.event.inputs.readmit }}
          FACT_MANIFEST_SHA256: ${{ github.event.inputs.fact_manifest_sha256 }}
          SURFACE_APPROVAL_SHA256: ${{ github.event.inputs.surface_approval_sha256 }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] || [ "$GITHUB_REF" != "refs/heads/main" ] ||
             [ "$GITHUB_RUN_ATTEMPT" != "1" ] || [ "$READMIT" != "false" ] ||
             ! [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]] || [ "$GITHUB_SHA" != "$EXPECTED_HEAD" ] ||
             ! [[ "$FACT_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]] ||
             ! [[ "$SURFACE_APPROVAL_SHA256" =~ ^([0-9a-f]{64})?$ ]]; then
            echo 'Paid readiness runs only as the first manual main attempt at the exact head with pinned digests' >&2
            exit 1
          fi

      # Narrow sparse checkout of the exact head: the legacy report, pages and
      # archives are never on disk, so the readiness surface preflight holds
      # without any surface approval.
      - name: Checkout the exact dispatched head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          token: ${{ secrets.PAT_GITHUB }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/index.md
            !/index.html
            !/current-findings.json
            !/sitemap.xml
            !/.sentryinsight-articles-fingerprint
            !/reports/

      - name: Verify the exact clean checkout
        id: source
        env:
          EXPECTED_HEAD: ${{ github.event.inputs.expected_head }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          echo "revision=$EXPECTED_HEAD" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install locked runtime dependencies
        run: uv sync --frozen

      - name: Admit paid readiness without readmission
        id: admission
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          node publication/cli.js admit --event-name "$GITHUB_EVENT_NAME" --event-path "$GITHUB_EVENT_PATH" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --readmit false

      - name: Record paid readiness start
        id: invoked
        if: steps.admission.outputs.decision == 'admitted'
        env:
          ADMISSION_KEY: ${{ steps.admission.outputs.admission_key }}
        run: node publication/cli.js invoked --key "$ADMISSION_KEY" --run-id "$GITHUB_RUN_ID"

      - name: Prepare readiness billing evidence
        if: steps.invoked.outcome == 'success'
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          raw = event.get('inputs', {}).get('billing_evidence', '')
          if not isinstance(raw, str) or len(raw.encode()) > 4096 or not isinstance(json.loads(raw), dict):
              raise ValueError('Bounded readiness billing evidence is required')
          path = Path(os.environ['RUNNER_TEMP']) / 'sentryinsight-paid-billing.json'
          fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
          with os.fdopen(fd, 'w') as stream:
              stream.write(raw)
          PY

      - name: Run the one-send paid readiness route
        id: readiness
        if: steps.invoked.outcome == 'success'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SENTRYINSIGHT_PAID_READINESS: kimi-moonshot-readiness-20261121
          SENTRYINSIGHT_FACT_MANIFEST_SHA256: ${{ github.event.inputs.fact_manifest_sha256 }}
          SENTRYINSIGHT_SURFACE_APPROVAL_SHA256: ${{ github.event.inputs.surface_approval_sha256 }}
          SENTRYINSIGHT_BILLING_EVIDENCE: ${{ runner.temp }}/sentryinsight-paid-billing.json
          SENTRYINSIGHT_ADMISSION_KEY: ${{ steps.admission.outputs.admission_key }}
          SENTRYINSIGHT_SOURCE_REVISION: ${{ steps.source.outputs.revision }}
          SENTRYINSIGHT_ATTEMPT_STORE: admission
        run: |
          mkdir -p "$RUNNER_TEMP/paid-readiness"
          .venv/bin/python -B scripts/paid_readiness_report.py --output "$RUNNER_TEMP/paid-readiness/candidate"

      - name: Retain the rendered pair for owner review
        if: success() && steps.readiness.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: paid-readiness-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/paid-readiness/candidate
          retention-days: 7
          if-no-files-found: error

      # A rendered pair is held for review, not published. Anything else
      # leaves the admission unresolved, so no readmission or retry follows.
      - name: Record paid readiness outcome
        if: always() && steps.invoked.outcome == 'success'
        env:
          ADMISSION_KEY: ${{ steps.admission.outputs.admission_key }}
          BINDING: ${{ steps.admission.outputs.binding }}
          READINESS: ${{ steps.readiness.outcome }}
        run: |
          if [ "$READINESS" = "success" ]; then OUTCOME=not-published
          elif [ "$READINESS" = "cancelled" ]; then OUTCOME=cancelled
          else OUTCOME=failed
          fi
          node publication/cli.js complete --key "$ADMISSION_KEY" --run-id "$GITHUB_RUN_ID" --outcome "$OUTCOME" --binding "$BINDING"
