name: Generate Exploitation Report

on:
  # Run when triggered by SentryDigest repository
  repository_dispatch:
    types: [sentrydigest-updated]
  
  # Schedule backup run (in case webhook fails). The workflow now fingerprints
  # the source article set and skips report generation when nothing
  # changed, so this only needs to catch a fully missed webhook, not run often.
  schedule:
    - cron: '30 6 * * *'  # Run once daily at 06:30 UTC
  
  # Allow manual triggering
  workflow_dispatch:

concurrency:
  group: sentryinsight-report-generation
  cancel-in-progress: false

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT_GITHUB }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Fetch canonical reporting identity verifier
        run: |
          python3 contracts/reporting-identity-verifier-v1.py fetch \
            --artifact verifier \
            --canonical-output "$RUNNER_TEMP/reporting-identity-verifier-v1.py"

      - name: Check reporting identity verifier drift
        run: |
          python3 contracts/reporting-identity-verifier-v1.py compare \
            --artifact verifier \
            --local-artifact contracts/reporting-identity-verifier-v1.py \
            --canonical-artifact "$RUNNER_TEMP/reporting-identity-verifier-v1.py"

      - name: Fetch canonical reporting identity contract
        run: |
          python3 contracts/reporting-identity-verifier-v1.py fetch \
            --artifact contract \
            --canonical-output "$RUNNER_TEMP/reporting-identity-v1.json"

      - name: Check reporting identity contract drift
        run: |
          python3 contracts/reporting-identity-verifier-v1.py compare \
            --artifact contract \
            --local-artifact contracts/reporting-identity-v1.json \
            --canonical-artifact "$RUNNER_TEMP/reporting-identity-v1.json"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install browser test runtime
        run: |
          npm ci
          npx playwright install --with-deps chromium
      
      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Run local validation
        run: bash scripts/local_validation.sh
      
      - name: Generate exploitation report
        id: generate
        run: uv run python main.py
        env:
          # Report generation calls OpenRouter directly (free model default);
          # no local OpenCode gateway is needed in CI.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SENTRYINSIGHT_MODEL: ${{ vars.SENTRYINSIGHT_MODEL || 'openrouter/nvidia/nemotron-3-ultra-550b-a55b:free' }}
          # Pass VT Intelligence API key under multiple common env names
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          VT_INTELLIGENCE_API_KEY: ${{ secrets.VT_INTELLIGENCE_API_KEY }}
          GOOGLE_TI_API_KEY: ${{ secrets.GOOGLE_TI_API_KEY }}
          # Optional tracing, scoped to this step so test runs never export.
          # Without the secret, nothing is sent.
          LOGFIRE_TOKEN: ${{ secrets.LOGFIRE_TOKEN }}
          LOGFIRE_ENVIRONMENT: github-actions
          LOGFIRE_SERVICE_VERSION: ${{ github.sha }}
      
      - name: Validate report content before publishing
        if: success() && steps.generate.outputs.report_generated == 'true'
        run: |
          uv run python scripts/validate_report.py index.md
          uv run python scripts/build_site.py --check
          npm run test:browser

      - name: Upload rendered report evidence
        id: generated-report-evidence
        if: always() && steps.generate.outputs.report_generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: generated-report-screenshots-${{ github.run_id }}
          path: test-results/screenshots
          if-no-files-found: error

      - name: Add rendered report review summary
        if: always() && steps.generate.outputs.report_generated == 'true'
        env:
          ARTIFACT_URL: ${{ steps.generated-report-evidence.outputs.artifact-url }}
        run: |
          {
            echo "## Rendered report review"
            echo
            echo "[Open the generated desktop, tablet, and phone screenshots](${ARTIFACT_URL})"
            echo
            echo "Review the dark logo, report date and counts, finding badges, desktop TOC, and mobile map before using the report."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package source review metadata
        id: source-review-package
        if: always() && steps.generate.outcome != 'skipped'
        run: uv run python scripts/review_sources.py package --root . --output "$RUNNER_TEMP/source-review-package"

      - name: Upload source review metadata
        id: source-review-artifact
        if: always() && steps.source-review-package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: source-review-${{ github.run_id }}
          path: ${{ runner.temp }}/source-review-package
          if-no-files-found: error
          retention-days: 90

      - name: Add source review summary
        id: source-review-summary
        if: always() && steps.source-review-artifact.outcome == 'success'
        env:
          ARTIFACT_URL: ${{ steps.source-review-artifact.outputs.artifact-url }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlsplit
          url = os.environ['ARTIFACT_URL']
          parsed = urlsplit(url)
          expected = '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'] + '/artifacts/'
          if parsed.scheme != 'https' or parsed.netloc != 'github.com' or not parsed.path.startswith(expected) or not parsed.path[len(expected):].isdigit() or parsed.query or parsed.fragment:
              raise SystemExit('Review artifact link missing or invalid')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('\n## Source coverage and review\n\n[Open validated review metadata](' + url + ')\n\n')
              stream.write('Held and rejected sources are not published findings. Eligible sources that were not cited are not established as irrelevant. Review metadata is retained for 90 days; expiry does not resolve review items. The outcome receipt identifies whether a new report was generated.\n')
          PY

      - name: Commit and push updated report
        if: success() && github.ref == 'refs/heads/main' && steps.generate.outputs.report_generated == 'true' && steps.source-review-summary.outcome == 'success'
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          # Force add the canonical report and generated site files
          git add -f index.md index.html current-findings.json sitemap.xml || true
          git add -f reports/ || true
          git add -f assets/site.css assets/report.js assets/vendor/ || true
          git add -f .sentryinsight-articles-fingerprint || true
          if git diff --cached --quiet; then
            echo "No report changes to commit"
            exit 0
          fi
          git commit -m "Update exploitation report [automated]"
          git pull --rebase origin main
          git push https://${{ secrets.PAT_GITHUB }}@github.com/${{ github.repository }}.git HEAD:main
