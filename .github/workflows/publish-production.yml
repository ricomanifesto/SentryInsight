name: Publish Production

# The only publisher of the production artifact branch, and only of the
# approved defensive package. It runs solely as the first manual attempt on
# main at the exact approved head. The approval triple (head, committed facts
# SHA-256, package inventory SHA-256) is verified by the Node publisher before
# it reads the artifact branch, resumes anything, writes a state record or
# pushes a ref. No workflow_run, schedule or workflow_call reaches it, and
# legacy resume and rollback are held (publication/DEFENSIVE_PUBLICATION.md).

on:
  workflow_dispatch:
    inputs:
      approved_head:
        description: 'Exact 40-hex main commit approved for promotion'
        type: string
        required: true
      approved_facts_sha256:
        description: 'SHA-256 of the canonical owner-reviewed config/paid-readiness-facts.json at that head'
        type: string
        required: true
      approved_package_sha256:
        description: 'Approved defensive package inventory SHA-256 (the local $0 build proposes it)'
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: publish-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Refuse anything but the first manual main attempt at the approved head
        env:
          APPROVED_HEAD: ${{ inputs.approved_head }}
          APPROVED_FACTS: ${{ inputs.approved_facts_sha256 }}
          APPROVED_PACKAGE: ${{ inputs.approved_package_sha256 }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] || [ "$GITHUB_REF" != "refs/heads/main" ] ||
             [ "$GITHUB_RUN_ATTEMPT" != "1" ] || ! [[ "$APPROVED_HEAD" =~ ^[0-9a-f]{40}$ ]] ||
             [ "$GITHUB_SHA" != "$APPROVED_HEAD" ] || ! [[ "$APPROVED_FACTS" =~ ^[0-9a-f]{64}$ ]] ||
             ! [[ "$APPROVED_PACKAGE" =~ ^[0-9a-f]{64}$ ]]; then
            echo 'Promotion runs only as the first manual main attempt at the exact approved head' >&2
            exit 1
          fi

      - name: Checkout the exact approved head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify the exact clean checkout
        env:
          APPROVED_HEAD: ${{ inputs.approved_head }}
        run: |
          test "$(git rev-parse HEAD)" = "$APPROVED_HEAD"
          test -z "$(git status --porcelain)"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install locked runtime dependencies
        run: uv sync --frozen

      - name: Configure Git
        run: |
          git config user.name 'GitHub Actions'
          git config user.email 'actions@github.com'

      # The publisher builds the package with the shared packager, refuses any
      # difference from the triple, and re-verifies before the ref write.
      - name: Publish the approved defensive package
        env:
          APPROVED_HEAD: ${{ inputs.approved_head }}
          APPROVED_FACTS: ${{ inputs.approved_facts_sha256 }}
          APPROVED_PACKAGE: ${{ inputs.approved_package_sha256 }}
        run: |
          source .venv/bin/activate
          node publication/cli.js publish --source "$APPROVED_HEAD" \
            --approved-head "$APPROVED_HEAD" \
            --approved-facts-sha256 "$APPROVED_FACTS" \
            --approved-package-sha256 "$APPROVED_PACKAGE"
